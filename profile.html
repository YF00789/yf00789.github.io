<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
    <div id="scroll-progress-bar"></div>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Library Logo">
            <h2>Library</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="team.html">Our Team</a></li>
                <li><a href="hub.html">Server Hub</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><button id="theme-toggle" class="mc-button">Night Vision</button></li>
            </ul>
        </nav>
    </header>
    <aside class="sidebar">
        <div id="sidebar-user-info" style="display: none; margin-bottom: 20px; padding: 10px; background-color: #a0a0a0; border: 4px solid #555;">
            <h3 style="margin-top: 0;">Player Info</h3>
            <p style="font-size: 0.8rem; font-family: 'Press Start 2P', monospace; margin: 10px 0;">Name: <span id="sidebar-name" style="color: #4caf50;"></span></p>
            <button id="sidebar-logout-btn" class="mc-button" style="width: 100%; padding: 5px; font-size: 0.7rem;">Log Out</button>
        </div>
        <h3>Account Status</h3>
        <p style="color: #4caf50;">Online & Active</p>
    </aside>
    <main>
        <section class="card" id="profile-container">
            <h2>Your Profile</h2>
            <div id="profile-data" class="profile-card">
                <h3>Player Details</h3>
                <p><strong>Username:</strong> <span id="prof-name"></span></p>
                <p><strong>Email:</strong> <span id="prof-email"></span></p>
                <p><strong>Phone:</strong> <span id="prof-phone"></span></p>
            </div>
            <br>
            <button id="logout-btn" class="mc-button">Log Out</button>
        </section>
    </main>
    <footer>
        <p>Project by: Ilya D.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
