<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Library Logo">
            <h2>Library</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="team.html">Our Team</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <aside class="sidebar">
        <h3>Location</h3>
        <p>X: 1302 Y: 85 Z: 784<br>Jungle Village</p>
        <br>
        <h3>Phone</h3>
        <p>(555) LIB-RARY</p>
    </aside>
    <main>
        <section class="card">
            <h2>Suggest a Book / Contact Us</h2>
            <p>Have a question or want to recommend a book for our collection? Fill out the form below!</p>
            <form id="contact-form" action="#" method="GET">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <label for="inquiryType">Inquiry Type:</label>
                <select id="inquiryType" name="inquiryType">
                    <option value="book_suggestion">Book Suggestion</option>
                    <option value="event_registration">Event Registration</option>
                    <option value="general_question">General Question</option>
                </select>
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
                <button type="submit">Submit Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Project by: Ilya D.</p>
    </footer>
</body>
</html>
