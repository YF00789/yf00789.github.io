<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Library</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
                    <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container mt-5 mb-5">
        <h2 class="mb-4">Resource List</h2>
        <div id="libraryCarousel" class="carousel slide border border-4 border-dark" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="3"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="4"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="5"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="6"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="7"></button>
                <button type="button" data-bs-target="#libraryCarousel" data-bs-slide-to="8"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="images/bookshelf.png" class="d-block w-100" alt="Bookshelf"></div>
                <div class="carousel-item"><img src="images/chiseled_bookshelf.png" class="d-block w-100" alt="Chiseled Bookshelf"></div>
                <div class="carousel-item"><img src="images/item_frame.png" class="d-block w-100" alt="Item Frame"></div>
                <div class="carousel-item"><img src="images/lantern.jpg" class="d-block w-100" alt="Lantern"></div>
                <div class="carousel-item"><img src="images/oak_sign.png" class="d-block w-100" alt="Oak Sign"></div>
                <div class="carousel-item"><img src="images/spruce_planks.png" class="d-block w-100" alt="Spruce Planks"></div>
                <div class="carousel-item"><img src="images/spruce_stairs.png" class="d-block w-100" alt="Spruce Stairs"></div>
                <div class="carousel-item"><img src="images/spruce_trapdoor.png" class="d-block w-100" alt="Spruce Trapdoor"></div>
                <div class="carousel-item"><img src="images/stone_bricks.png" class="d-block w-100" alt="Stone Bricks"></div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#libraryCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#libraryCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </main>
    <footer class="bg-dark text-center text-light py-3 mt-auto">
        <p class="mb-0">Project by Ilya D.</p>
    </footer>
